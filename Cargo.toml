[package]
name = "niruthemeselector"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Graphical NIRUX theme selector with representative previews"

[dependencies]
toml = "0.8"
x11rb = { version = "0.13", features = ["randr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
