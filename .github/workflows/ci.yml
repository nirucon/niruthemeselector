name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: sh tests/cli-smoke.sh target/release/niruthemeselector
  msrv:
    # rust-version in Cargo.toml, which is also Debian 13's rustc.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo build --locked
      - run: cargo build --release --locked
      - run: cargo test --locked
  xvfb:
    # The window under Xvfb against a fixture niructl: wheel, Swedish
    # typing, paste, double-click apply, undo, idle spawns and a slow Apply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool x11-apps x11-xkb-utils xclip fonts-dejavu-core
      - run: cargo test --locked --test xvfb -- --ignored
